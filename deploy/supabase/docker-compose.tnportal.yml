# True North Operations Portal: our settings on top of Supabase's docker-compose.yml.
# Loaded through COMPOSE_FILE in .env. The services we run are listed in
# /opt/tnportal/bin/supabase.sh; realtime, edge functions and the pooler are not
# used by the portal and are not started.
#
# userns_mode: host on every service. ScalaHosting installed Docker with user
# remapping (userns-remap), and this server's / is mode 711, which the remapped
# runtime cannot open ("error jailing process inside rootfs: open /"). The
# remapping was turned off on 30 September 2026 (deploy/README.md); this keeps
# our containers working if it is ever turned back on.

x-host-userns: &host-userns
  userns_mode: host

services:
  db:
    <<: *host-userns
    volumes:
      # A folder instead of the named volume db-config: named volumes are created
      # in the remapped area (owner 2000000000), where postgres cannot write its
      # pgsodium key. Owned by the image's postgres user (100:101).
      - ./volumes/db/config:/etc/postgresql-custom
      # The image's pg_hba.conf plus one line: replication for supabase_admin
      # over the local socket, for the nightly pg_basebackup (deploy/backup).
      - ./volumes/db/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
  rest: *host-userns
  storage: *host-userns
  imgproxy: *host-userns
  meta: *host-userns
  studio: *host-userns
  api-gw: *host-userns
  auth:
    <<: *host-userns
    environment:
      # Sessions (the same as on Supabase cloud since 28 September 2026):
      # sign in again after 2 months, or after 15 days without use.
      GOTRUE_SESSIONS_TIMEBOX: 1440h
      GOTRUE_SESSIONS_INACTIVITY_TIMEOUT: 360h
      # The sign-in code is 6 digits.
      GOTRUE_MAILER_OTP_LENGTH: "6"
      GOTRUE_RATE_LIMIT_EMAIL_SENT: "100"
      # Two-step sign-in with an authenticator app.
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      # The branded emails: public/email-templates in the portal's repository,
      # fetched from the portal container over Docker's network
      # (EMAIL_TEMPLATES_BASE, set by apply-env.sh).
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${EMAIL_TEMPLATES_BASE}/magic-link.html
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${EMAIL_TEMPLATES_BASE}/confirm-signup.html
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: "Your sign-in code: {{ .Token }}"
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: "Welcome to the True North Operations Portal: your code is {{ .Token }}"
