# The portal's checks: types, lint errors and the test suite (security audit,
# owner, 9 November 2026). They run on every pull request, so a change from a
# branch is checked before the owner merges it, and before every staging
# deploy (deploy-staging.yml calls this), so a broken commit never reaches the
# server. No secrets are used here.
#
# Actions are pinned to a commit, not a tag, so a moved tag cannot change what runs.

name: Checks

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Types
        run: npm run typecheck
      - name: Lint (errors only)
        run: npx eslint src --quiet
      - name: Tests
        # One test that waits on timers can be slow on a busy runner; a second try covers it.
        run: npx vitest run --retry 2
