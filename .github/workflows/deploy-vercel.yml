# The old address on Vercel. Since the switch-over (5 October 2026) it only
# redirects to truenorthportal.online (LEGACY_REDIRECT_TO), so pushes no longer
# deploy it; the portal itself deploys to its own server (deploy-server.yml).
# Run by hand only to change the redirect. Retired with phase 7.
name: Deploy to Vercel

on:
  workflow_dispatch:

# One deploy at a time, in push order, so an older commit never lands after a newer one.
concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_ORG_ID: team_MGtTHRyqww5d9HxsLNDe3tUU
      VERCEL_PROJECT_ID: prj_2uLEz5NtJpXpO1azEnsiwZYOjr6S
      VERCEL_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@53 deploy --prod --yes
