# Promote a tested commit to production, truenorthportal.online.
#
# Since 6 October 2026 a push to main goes to staging first
# (deploy-staging.yml, staging.truenorthportal.online). Once it has been tried
# there: Actions > "Promote to production" > Run workflow, with that commit's
# sha (or main, when staging runs the newest commit). Also how to go back to an
# older commit.
# The key in SERVER_SSH_KEY can only run deploy/portal/actions-deploy.sh on the
# server, which builds and starts the commit with deploy/portal/deploy.sh.

name: Promote to production

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit to promote (the sha tested on staging), or main"
        required: true
        default: main

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Build and start on the server
        env:
          SERVER_SSH_KEY: ${{ secrets.SERVER_SSH_KEY }}
          REF: ${{ inputs.ref }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SERVER_SSH_KEY" > ~/.ssh/server
          chmod 600 ~/.ssh/server
          # The server's host key, so the connection cannot be redirected.
          echo "[174.136.29.221]:6543 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIACs51YqrmoFTzJ1ucV8ZQmucWUl8FlzNB8iczVgINco" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/server -p 6543 -o IdentitiesOnly=yes -o ServerAliveInterval=30 -o ServerAliveCountMax=20 \
            portal@174.136.29.221 "deploy $REF"
